name: BLUE KITE checks
on:
  pull_request:
  push:
    branches: ['feat/blue-kite-*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run build:gas
      - run: npm test
      - run: npm run demo
